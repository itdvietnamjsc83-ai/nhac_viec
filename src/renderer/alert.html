<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Nhắc Việc - Cảnh báo</title>
<style>
:root { --bg: #ffffff; --soft: #f1f3f8; --hover: #e6ebfa; --text: #1b1f2a; --muted: #8a91a3; --accent: #3366ff; --accent-soft: #e8eeff; --green: #12b76a; --red: #f04438; --amber: #d18b00; --amber-soft: #fff6db; --line: #eceef3; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1e25; --soft: #262a35; --hover: #2d3445; --text: #e8eaf0; --muted: #868da0; --accent: #5b84ff; --accent-soft: #1f2a48; --amber-soft: #3a3218; --line: #2b303b; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", -apple-system, Roboto, Arial, sans-serif; overflow: hidden; user-select: none; }
body { border-top: 4px solid var(--amber); }
header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px 14px; -webkit-app-region: drag; }
header b { font-size: 14px; flex: 1; }
.bell { display: inline-block; animation: ring 1.2s ease-in-out 3; transform-origin: 50% 0; }
button { font: inherit; border: 0; border-radius: 7px; cursor: pointer; background: var(--soft); color: var(--text); padding: 5px 9px; -webkit-app-region: no-drag; transition: background .15s, transform .1s; }
button:hover { background: var(--hover); }
button:active { transform: scale(.96); }
.x { background: none; color: var(--muted); font-size: 16px; padding: 2px 8px; }
#list { padding: 0 12px 10px; max-height: calc(100vh - 44px); overflow-y: auto; }
.item { background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; animation: in .25s; }
.title { font-weight: 700; font-size: 14px; }
.meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.meta .late { color: var(--red); font-weight: 600; }
.lbl { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.snooze { display: flex; flex-wrap: wrap; gap: 5px; }
.snooze button { background: var(--bg); }
.snooze button:hover { background: var(--accent-soft); color: var(--accent); }
.custom { display: none; gap: 5px; margin-top: 6px; align-items: center; }
.custom.on { display: flex; flex-wrap: wrap; }
.custom input[type=datetime-local] { flex: 1; min-width: 0; }
.custom span { color: var(--muted); font-size: 12px; }
.custom input, .custom select { font: inherit; border: 0; border-radius: 7px; padding: 5px 7px; background: var(--bg); color: var(--text); }
.custom input[type=number] { width: 64px; }
.actions { display: flex; gap: 6px; margin-top: 8px; }
.done { background: var(--green); color: #fff; font-weight: 700; }
.done:hover { background: var(--green); filter: brightness(1.08); }
.spacer { flex: 1; }
.link { background: none; color: var(--accent); }
@keyframes ring { 0%, 50%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<header><span class="bell">🔔</span><b id="head">Đến giờ nhắc việc</b><button class="x" id="close" title="Ẩn (việc vẫn nằm trong hàng đợi)">✕</button></header>
<div id="list"></div>
<script src="alert.js"></script>
</body>
</html>
