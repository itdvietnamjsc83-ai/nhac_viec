# Tự động đóng gói bộ cài Windows (.exe) và macOS (.dmg) trên GitHub.
# Cách dùng: đẩy mã nguồn lên GitHub, vào tab Actions > "Đóng gói Nhắc Việc" > Run workflow,
# chạy xong tải bộ cài ở mục Artifacts.
name: Đóng gói Nhắc Việc
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - run: npm run dist:mac
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: NhacViec-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
  android:
    # Bản điện thoại Android (APK cài trực tiếp, chưa ký phát hành)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run sync-libs && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NhacViec-Android
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  draft:
    # Gom các bộ cài vào một bản phát hành NHÁP (chỉ chủ kho thấy) để tải về dễ dàng
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Tạo bản nháp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(date +%Y%m%d-%H%M)
          mv out/NhacViec-Android/*.apk out/NhacViec-Android/NhacViec-android.apk
          gh release create "build-$V" --repo "${{ github.repository }}" --draft \
            --title "Bản build $V" --notes "Bản build tự động từ ${{ github.sha }}" \
            out/NhacViec-Windows/*.exe out/NhacViec-macOS/*.dmg out/NhacViec-Android/*.apk
